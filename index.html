<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>横スクロールアクション MVP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Pixel Run</h1>
      <p class="controls">← → / A D：移動　｜　↑ / W / Space：ジャンプ　｜　急襲・地中・追跡・遠距離攻撃の敵に注意　｜　大きな星を3つ集めよう</p>
      <canvas id="game" width="960" height="540" aria-label="横スクロールアクションゲーム"></canvas>
      <div class="hud">
        <span id="status">コイン: 0　|　星: 0/3　|　残機: 1　|　アーマーなし</span>
        <div class="buttons">
          <button id="bgm" type="button">BGM: OFF</button>
          <button id="restart" type="button">リスタート</button>
        </div>
      </div>
      <p id="message" class="message" aria-live="polite"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
